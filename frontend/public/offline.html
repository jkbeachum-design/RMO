<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2a2a" />
    <title>Offline — RMO Operator</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #f4f6f5;
        color: #0f172a;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Instrument Serif", serif;
        font-size: 2rem;
        font-weight: 400;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.5;
        color: #475569;
      }
      a {
        display: inline-block;
        margin: 0.25rem;
        padding: 0.7rem 1rem;
        background: #0f2a2a;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
      a.secondary {
        background: #fff;
        color: #0f2a2a;
        border: 1px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Open a page you already visited while online — Operator home, Submit report, or History.
        Drafts stay on this phone until you’re back on signal.
      </p>
      <p>
        <a href="/operator">Operator home</a>
        <a class="secondary" href="/operator/submit-report">Submit report</a>
      </p>
    </main>
  </body>
</html>
